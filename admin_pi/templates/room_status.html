<form action="/update_room" method="POST">
    <select name="room">
        <option>A101</option>
        <option>A102</option>
        <option>A103</option>
    </select>

    <select name="status">
        <option>Available</option>
        <option>Occupied</option>
        <option>Maintenance</option>
        <option>Fault</option>
    </select>

    <button type="submit">Update</button>
</form>

<h2>Room Status</h2>

<ul>
    {% for room, status in rooms.items() %}
        <li>
            {{ room }} → {{ status }}
        </li>
    {% endfor %}
</ul>
