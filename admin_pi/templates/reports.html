<!DOCTYPE html>
<html>
<head>
    <title>Usage Reports</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; }
        .navbar a { color: white; text-decoration: none; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .card h2 { margin-top: 0; color: #2c3e50; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; text-decoration: none; }
        .btn:hover { background-color: #34495e; }
        .charts { display: flex; flex-wrap: wrap; gap: 20px; }
        .charts img { max-width: 100%; border-radius: 6px; border: 1px solid #ddd; }
        .no-chart { color: #888; font-style: italic; }
    </style>
</head>
<body>
<div class="navbar">
    <h2>Usage Reports</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>
<div class="container">
    <div class="card">
        <h2>Generate Reports</h2>
        <p>Click the button below to generate booking frequency and status charts from the current database.</p>
        <a href="/generate_report" class="btn">Generate Reports</a>
    </div>

    <div class="card">
        <h2>Booking Charts</h2>
        <div class="charts">
            <div>
                <p><strong>Booking Frequency by Room</strong></p>
                <img src="/static/booking_frequency.png" alt="Booking Frequency" onerror="this.outerHTML='<p class=no-chart>No chart yet — click Generate Reports.</p>'">
            </div>
            <div>
                <p><strong>Booking Status Distribution</strong></p>
                <img src="/static/booking_status.png" alt="Booking Status" onerror="this.outerHTML='<p class=no-chart>No chart yet — click Generate Reports.</p>'">
            </div>
        </div>
    </div>
</div>
</body>
</html>
