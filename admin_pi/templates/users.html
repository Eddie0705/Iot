<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; }
        .navbar a { color: white; text-decoration: none; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        th { background-color: #2c3e50; color: white; padding: 12px 15px; text-align: left; }
        td { padding: 10px 15px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; text-decoration: none; }
        .btn-edit { background-color: #2c3e50; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2c3e50; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { padding: 10px 20px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        h2 { color: #2c3e50; }
    </style>
</head>
<body>
<div class="navbar">
    <h2>Manage Users</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>
<div class="container">
    <h2>All Users</h2>
    <table>
        <tr><th>ID</th><th>Email</th><th>Full Name</th><th>RMIT ID</th><th>Role</th><th>Status</th><th>Actions</th></tr>
        {% for user in users %}
        <tr>
            <td>{{ user[0] }}</td><td>{{ user[1] }}</td><td>{{ user[2] }}</td>
            <td>{{ user[3] }}</td><td>{{ user[4] }}</td><td>{{ user[5] }}</td>
            <td>
                <a href="/edit_user/{{ user[0] }}" class="btn btn-edit">Edit</a>
                <form action="/delete_user/{{ user[0] }}" method="POST" style="display:inline" onsubmit="return confirm('Delete this user?')">
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <div class="card">
        <h3>Create Security Staff</h3>
        <form action="/create_staff" method="POST">
            <label>Email</label><input type="email" name="email" required>
            <label>Password</label><input type="password" name="password" required>
            <label>Full Name</label><input type="text" name="full_name" required>
            <label>RMIT ID</label><input type="text" name="rmit_id" required>
            <button type="submit" class="btn-submit">Create Staff</button>
        </form>
    </div>
</div>
</body>
</html>
