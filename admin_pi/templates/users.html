<h2>Users</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Full Name</th>
        <th>RMIT ID</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user[0] }}</td>
        <td>{{ user[1] }}</td>
        <td>{{ user[2] }}</td>
        <td>{{ user[3] }}</td>
        <td>{{ user[4] }}</td>
        <td>{{ user[5] }}</td>
        <td>
            <a href="/edit_user/{{ user[0] }}">Edit</a>
            <form action="/delete_user/{{ user[0] }}" method="POST" style="display:inline"
                  onsubmit="return confirm('Delete this user?')">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<h2>Create Security Staff</h2>

<form action="/create_staff" method="POST">
    <label>Email: <input type="email" name="email" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>
    <label>Full Name: <input type="text" name="full_name" required></label><br>
    <label>RMIT ID: <input type="text" name="rmit_id" required></label><br>
    <button type="submit">Create Staff</button>
</form>
