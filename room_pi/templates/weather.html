{% extends 'base.html' %}

{% block content %}
    <h1>Weather Stats</h1>
        <p>Temperature: <span id="temp">{{ temperature }}</span>°C</p>
        <p>Humidity: <span id="humid">{{ humidity }}</span>%</p>
        <p>Pressure: <span id="press">{{ pressure }}</span> hPa</p>

    <script>
        function fetchWeather() {
            // Call the JSON data route
            fetch('/weather-data')
                .then(response => response.json())
                .then(data => {
                    // Update the HTML text with the new values
                    document.getElementById('temp').innerText = data.temperature;
                    document.getElementById('humid').innerText = data.humidity;
                    document.getElementById('press').innerText = data.pressure;
                })
                .catch(error => console.error('Error updating weather:', error));
        }

        // Check for new weather data every 3000 milliseconds (3 seconds)
        setInterval(fetchWeather, 500);
    </script>
{% endblock %}
