<!DOCTYPE html>
<html>
<head>
    <title>Security Room Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #1a6b3c;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
            color: #1a6b3c;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1a6b3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #145530;
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.95em;
            text-align: center;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .hint {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Security Room Status</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>

<div class="container">
    <div class="card">
        <h2>Update Room Status</h2>
        <p class="hint">Security staff can update room status and trigger fault warnings.</p>

        {% if response %}
            <div class="message {% if response.status == 'success' %}success{% else %}error{% endif %}">
                {{ response.message }}
            </div>
        {% endif %}

        <form method="POST" action="/security-room-status">
            <label>Room Name</label>
            <select name="room_name" required>
                <option value="" disabled selected>Select a room</option>
                {% for room in rooms %}
                <option value="{{ room.room_name }}">{{ room.room_name }}</option>
                {% endfor %}
            </select>

            <label>Status</label>
            <select name="status" required>
                <option value="available">Available</option>
                <option value="in_use">In Use</option>
                <option value="maintenance">Maintenance</option>
                <option value="fault">Fault</option>
            </select>

            <button type="submit">Update Status</button>
        </form>
    </div>
</div>

</body>
</html>
